name: hyper-trader

services:
  postgres:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/10-hyper-trader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hyper_trader"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  catalog:
    image: oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
    user: "1000:1000"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /app
    entrypoint: ["/bin/sh", "/deployment/start-catalog.sh"]
    environment:
      NOTIFICATION_SERVICE_ORIGIN: ${BACKEND_ORIGIN:?Set BACKEND_ORIGIN}
      NOTIFICATION_PORT: "8788"
      NOTIFICATION_INSTANCE_ID: vps-catalog
      NOTIFICATION_TLS_CERT_FILE: /run/secrets/upstream_cert
      NOTIFICATION_TLS_KEY_FILE: /run/secrets/upstream_key
      NOTIFICATION_ENABLE_PROVIDER_WORKERS: "false"
    secrets:
      - database_url
      - upstream_cert
      - upstream_key
    volumes:
      - ${RELEASE_DIR:?Set RELEASE_DIR}:/app:ro
      - ./start-catalog.sh:/deployment/start-catalog.sh:ro
    ports:
      - "127.0.0.1:8788:8788"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - 'const r=require("node:https").get({hostname:"127.0.0.1",port:8788,path:"/health",servername:"hyper-trader-backend.internal",ca:require("node:fs").readFileSync(process.env.NOTIFICATION_TLS_CERT_FILE),headers:{host:new URL(process.env.NOTIFICATION_SERVICE_ORIGIN).host}},s=>{s.resume();if(s.statusCode!==200)process.exitCode=1});r.setTimeout(4000,()=>r.destroy(new Error("health timeout")));r.on("error",()=>process.exitCode=1)'
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  postgres_password:
    file: /opt/hyper-trader/secrets/postgres-password
  app_password:
    file: /opt/hyper-trader/secrets/app-password
  database_url:
    file: /opt/hyper-trader/secrets/database-url
  upstream_cert:
    file: /opt/hyper-trader/secrets/upstream-cert.pem
  upstream_key:
    file: /opt/hyper-trader/secrets/upstream-key.pem

volumes:
  postgres_data:
